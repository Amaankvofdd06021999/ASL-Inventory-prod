<!doctype html>
<html lang="en">

<title>ASL Inventory Coming Soon</title>
<meta name="description" content="Parts, Stock and Fleet Management for Arawak Stevedoring Limited all in one Place. Launching 1 December 2026.">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="ASL Inventory is coming soon">
<meta property="og:description" content="Parts, Stock and Fleet Management for Arawak Stevedoring Limited all in one Place.">
<meta property="og:image" content="/poster.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Layout: looping warehouse video, softened and graded, under a centred headline and countdown; ASL mark top-left, MCash wordmark bottom-left. Single committed dark look. */
  :root {
    --bg: #101a2c;
    --fg: #f4f6fa;
    --muted: rgba(244, 246, 250, .74);
    --dim: rgba(244, 246, 250, .52);
    --gold: #d9ae5a;
    --spring: #66d575;
    --glass: rgba(244, 246, 250, .08);
    --glass-line: rgba(244, 246, 250, .18);
    --font-display: "neue-haas-grotesk-display", "neue-haas-grotesk-text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-main: "neue-haas-grotesk-text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-main); overflow: hidden; -webkit-font-smoothing: antialiased; }

  .bgwrap { position: fixed; inset: 0; overflow: hidden; background: var(--bg); }
  .bg { position: absolute; inset: -3%; width: 106%; height: 106%; object-fit: cover; object-position: center;
    filter: blur(1.6px) saturate(.85) brightness(.78); animation: drift 36s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: scale(1) translate3d(0, 0, 0); } to { transform: scale(1.06) translate3d(-1%, 0.5%, 0); } }
  .grade { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 72% 62% at 50% 46%, rgba(16, 26, 44, .14), rgba(16, 26, 44, .66) 100%),
                linear-gradient(180deg, rgba(16, 26, 44, .45), rgba(16, 26, 44, .05) 28%, rgba(16, 26, 44, .05) 72%, rgba(16, 26, 44, .5)); }
  @media (prefers-reduced-motion: reduce) { .bg { animation: none; } }

  .ui {
    position: relative; z-index: 2; height: 100%; box-sizing: border-box;
    display: grid; grid-template-rows: auto 1fr auto;
    padding-block: clamp(16px, 3vh, 28px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; min-width: 0; }
  .asl { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .asl img { height: clamp(40px, 5.6vw, 58px); width: auto; display: block; }
  .asl .name { font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: -.02em; line-height: 1.1; }
  .asl .name small { display: block; font-family: var(--font-main); font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 2px; }
  @media (max-width: 560px) { .asl .name { display: none; } }
  .mono { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
  @media (max-width: 560px) { .mono .hide { display: none; } }

  .centre { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: clamp(14px, 2.6vh, 26px); min-width: 0; padding-bottom: 2vh; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1px solid var(--glass-line); background: var(--glass);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font-size: 13px; color: var(--muted); border-radius: 999px; }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--spring); box-shadow: 0 0 10px var(--spring); }
  h1 { margin: 0; font-family: var(--font-display); font-size: clamp(42px, 6.6vw, 96px); line-height: .98; letter-spacing: -.035em; text-wrap: balance; text-shadow: 0 2px 34px rgba(0, 0, 0, .4); }
  h1 b { font-weight: 600; display: block; } h1 span { font-weight: 300; display: block; color: rgba(244, 246, 250, .9); }
  .lede { margin: 0; max-width: 44ch; font-size: clamp(15px, 1.35vw, 19px); line-height: 1.45; color: var(--muted); text-wrap: balance; }

  .timer { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(10px, 1.4vw, 18px); width: min(100%, 640px); margin-top: clamp(6px, 1.2vh, 16px); }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: clamp(14px, 2vw, 26px) 8px;
    background: var(--glass); border: 1px solid var(--glass-line); border-radius: 14px; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); min-width: 0; }
  .num { font-family: var(--font-display); font-weight: 500; font-size: clamp(30px, 3.8vw, 50px); line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
  @media (max-width: 480px) { .timer { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .note { margin: 0; font-size: 13px; color: var(--dim); }

  .foot { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .powered { display: inline-flex; align-items: center; gap: 10px; font-size: 12px; color: var(--dim); }
  .powered svg { height: 16px; width: auto; color: var(--fg); display: block; }
  @media (max-height: 620px) { .lede, .note { display: none; } .centre { gap: 10px; } }
</style>
</head>
<body>

<div class="bgwrap" aria-hidden="true">
  <video class="bg" autoplay muted loop playsinline preload="auto" poster="poster.jpg">
    <source src="forklift.mp4" type="video/mp4">
  </video>
  <div class="grade"></div>
</div>

<div class="ui">
  <header class="bar">
    <div class="asl">
      <img src="asl-logo-light.png" alt="Arawak Stevedoring Limited">
      <div class="name">ASL Inventory<small>Arawak Stevedoring Limited</small></div>
    </div>
    <div class="mono"><span class="hide">Arawak Cay · Nassau · </span>25°04′N 77°21′W</div>
  </header>

  <main class="centre">
    <div class="pill">Launching soon</div>
    <h1><b>ASL Inventory</b><span>is coming soon</span></h1>
    <p class="lede">Parts, Stock and Fleet Management for Arawak Stevedoring Limited all in one Place.</p>
    <div class="timer" role="timer" aria-live="off">
      <div class="cell"><div class="num" id="d">00</div><div class="lbl">Days</div></div>
      <div class="cell"><div class="num" id="h">00</div><div class="lbl">Hours</div></div>
      <div class="cell"><div class="num" id="m">00</div><div class="lbl">Minutes</div></div>
      <div class="cell"><div class="num" id="s">00</div><div class="lbl">Seconds</div></div>
    </div>
    <p class="note" id="launch-note"></p>
  </main>

  <footer class="foot">
    <div class="powered">Powered by
      <svg viewBox="0 0 253 37" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MCash">

      </svg>
    </div>
    <div class="mono" id="launch-label"></div>
  </footer>
</div>

<script>
(function () {
  const LAUNCH = new Date('2026-12-01T09:00:00-05:00');   // change the launch moment here
  const pad = n => String(n).padStart(2, '0');
  const $ = id => document.getElementById(id);
  const dateText = LAUNCH.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'America/Nassau' });
  $('launch-label').textContent = 'Launch · ' + dateText;
  $('launch-note').textContent = 'Going live ' + dateText + ' for ASL mechanics, storekeepers and supervisors.';
  function tick() {
    let diff = Math.max(0, LAUNCH - Date.now()) / 1000;
    const d = Math.floor(diff / 86400); diff -= d * 86400;
    const h = Math.floor(diff / 3600); diff -= h * 3600;
    const m = Math.floor(diff / 60); const s = Math.floor(diff - m * 60);
    $('d').textContent = pad(d); $('h').textContent = pad(h); $('m').textContent = pad(m); $('s').textContent = pad(s);
  }
  tick(); setInterval(tick, 1000);
  // autoplay can be refused in some app views; retry once the page is visible
  const v = document.querySelector('video.bg');
  const play = () => { const p = v.play(); if (p && p.catch) p.catch(() => {}); };
  play(); document.addEventListener('visibilitychange', () => { if (!document.hidden) play(); });
})();
</script>
</body>
</html>
